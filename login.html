<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · AI 室内设计平台</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
  body { background: var(--sidebar-bg); overflow: hidden; }
  .login-wrap {
    display: flex; min-height: 100vh;
  }
  .login-left {
    flex: 1.2;
    background: linear-gradient(135deg, #1E2A26 0%, #2D5A4E 100%);
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }
  .login-left::before {
    content: ''; position: absolute; top: -100px; right: -100px;
    width: 400px; height: 400px; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .login-left::after {
    content: ''; position: absolute; bottom: -80px; left: -80px;
    width: 300px; height: 300px; border: 1px solid rgba(184,149,106,0.15);
    border-radius: 50%;
  }
  .login-brand {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px; font-weight: 700; color: #fff;
    margin-bottom: 8px; position: relative; z-index: 1;
  }
  .login-brand-sub {
    font-size: 13px; color: rgba(255,255,255,0.5);
    letter-spacing: 2px; margin-bottom: 48px; position: relative; z-index: 1;
  }
  .login-slogan {
    font-family: 'Noto Serif SC', serif;
    font-size: 36px; font-weight: 600; color: #fff;
    line-height: 1.4; margin-bottom: 20px; position: relative; z-index: 1;
  }
  .login-slogan span { color: var(--bronze); }
  .login-desc {
    font-size: 14px; color: rgba(255,255,255,0.6);
    line-height: 1.8; max-width: 400px; position: relative; z-index: 1;
  }
  .login-features {
    display: flex; gap: 32px; margin-top: 48px; position: relative; z-index: 1;
  }
  .login-feature {
    color: rgba(255,255,255,0.7); font-size: 12px;
  }
  .login-feature .num {
    font-family: 'Noto Serif SC', serif;
    font-size: 24px; font-weight: 700; color: var(--bronze);
    display: block; margin-bottom: 4px;
  }
  .login-right {
    flex: 1;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
  }
  .login-card {
    width: 100%; max-width: 380px;
  }
  .login-card h2 {
    font-family: 'Noto Serif SC', serif;
    font-size: 24px; font-weight: 700; margin-bottom: 8px;
  }
  .login-card .sub {
    font-size: 13px; color: var(--muted); margin-bottom: 32px;
  }
  .demo-account {
    background: var(--accent-light);
    border: 1px solid rgba(45,90,78,0.2);
    border-radius: var(--r-sm);
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--accent);
    line-height: 1.7;
  }
  .demo-account strong { font-weight: 600; }
  @media (max-width: 900px) {
    .login-left { display: none; }
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-left">
    <div class="login-brand">AI Design Studio</div>
    <div class="login-brand-sub">INTERIOR DESIGN · AI WORKFLOW</div>
    <h1 class="login-slogan">从项目创建到<br><span>知识反哺</span>的<br>全流程设计管线</h1>
    <p class="login-desc">AI 驱动的室内设计协同平台，覆盖建模、需求访谈、布局生成、风格匹配、渲染迭代到交付归档的完整工作流。</p>
    <div class="login-features">
      <div class="login-feature"><span class="num">6</span>核心阶段</div>
      <div class="login-feature"><span class="num">5</span>冻结确认点</div>
      <div class="login-feature"><span class="num">∞</span>知识闭环</div>
    </div>
  </div>
  <div class="login-right">
    <div class="login-card">
      <h2>欢迎回来</h2>
      <p class="sub">登录以继续您的设计项目</p>
      <div class="demo-account">
        <strong>演示账号</strong><br>
        设计师：designer@demo.com / 123456<br>
        管理员：admin@demo.com / 123456
      </div>
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" class="form-input" value="designer@demo.com" placeholder="请输入邮箱">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" value="123456" placeholder="请输入密码">
      </div>
      <div class="flex items-center justify-between mb-md">
        <label class="flex items-center gap-sm text-sm" style="cursor:pointer;">
          <input type="checkbox" checked> 记住我
        </label>
        <a href="#" class="text-sm">忘记密码？</a>
      </div>
      <a href="dashboard.html" class="btn btn-primary w-full" style="justify-content:center; padding:10px;">登 录</a>
      <p class="text-center text-sm text-muted mt-md">
        还没有账号？<a href="#">申请试用</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
