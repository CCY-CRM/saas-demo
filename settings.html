<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 · AI 室内设计平台</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
  .settings-nav { width:200px; flex-shrink:0; border-right:1px solid var(--line); background:var(--card); }
  .settings-nav-item { padding:10px 20px; font-size:13px; cursor:pointer; border-left:3px solid transparent; color:var(--ink-soft); }
  .settings-nav-item:hover { background:var(--line-soft); }
  .settings-nav-item.active { background:var(--accent-light); border-left-color:var(--accent); color:var(--accent); font-weight:600; }
  .settings-content { flex:1; padding:24px; min-width:0; }
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" style="width:60px;">
    <div class="sidebar-brand" style="padding:16px 0;text-align:center;"><div class="logo" style="font-size:20px;">A</div></div>
    <nav class="sidebar-nav"><div class="nav-section" style="padding:0 8px;">
      <a href="dashboard.html" class="nav-item" style="justify-content:center;padding:10px;">🏠</a>
      <a href="projects.html" class="nav-item" style="justify-content:center;padding:10px;">📋</a>
      <a href="knowledge.html" class="nav-item" style="justify-content:center;padding:10px;">📚</a>
      <a href="materials.html" class="nav-item" style="justify-content:center;padding:10px;">🧱</a>
    </div><div class="nav-section" style="padding:0 8px;">
      <a href="team.html" class="nav-item" style="justify-content:center;padding:10px;">👥</a>
      <a href="settings.html" class="nav-item active" style="justify-content:center;padding:10px;">⚙️</a>
    </div></nav>
  </aside>
  <div class="main-wrapper" style="margin-left:60px;">
    <header class="topbar">
      <div class="topbar-title">系统设置</div>
      <div class="topbar-actions"><button class="btn btn-primary btn-sm">保存更改</button></div>
    </header>
    <div style="display:flex; height:calc(100vh - 56px);">
      <div class="settings-nav">
        <div style="padding:12px 20px; font-size:11px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line);">设置</div>
        <div class="settings-nav-item active">👤 账号设置</div>
        <div class="settings-nav-item">🏢 公司信息</div>
        <div class="settings-nav-item">🔔 通知偏好</div>
        <div class="settings-nav-item">🔗 第三方集成</div>
        <div class="settings-nav-item">💳 计费与订阅</div>
        <div class="settings-nav-item">🔐 安全设置</div>
      </div>
      <div class="settings-content">
        <div class="card mb-lg" style="max-width:640px;">
          <div class="card-title" style="margin-bottom:16px;">账号设置</div>
          <div class="flex items-center gap-md mb-lg" style="padding-bottom:20px; border-bottom:1px solid var(--line-soft);">
            <div class="avatar" style="width:64px;height:64px;font-size:24px;background:var(--accent);">陈</div>
            <div>
              <div class="text-base font-semibold">陈设计</div>
              <div class="text-sm text-muted">chen@company.com</div>
              <button class="btn btn-secondary btn-sm mt-sm">更换头像</button>
            </div>
          </div>
          <div class="grid grid-2 gap-md">
            <div class="form-group"><label class="form-label">姓名</label><input type="text" class="form-input" value="陈设计"></div>
            <div class="form-group"><label class="form-label">邮箱</label><input type="email" class="form-input" value="chen@company.com"></div>
            <div class="form-group"><label class="form-label">手机号</label><input type="tel" class="form-input" value="138****8888"></div>
            <div class="form-group"><label class="form-label">职位</label><input type="text" class="form-input" value="首席设计师"></div>
          </div>
          <div class="form-group"><label class="form-label">个人简介</label><textarea class="form-textarea" placeholder="介绍一下自己...">8年室内设计经验，擅长现代简约和日式风格，注重空间功能性与居住体验的平衡。</textarea></div>
        </div>
        <div class="card mb-lg" style="max-width:640px;">
          <div class="card-title" style="margin-bottom:16px;">公司信息</div>
          <div class="grid grid-2 gap-md">
            <div class="form-group"><label class="form-label">公司名称</label><input type="text" class="form-input" value="XX 设计工作室"></div>
            <div class="form-group"><label class="form-label">公司地址</label><input type="text" class="form-input" value="上海市静安区xxx路xxx号"></div>
            <div class="form-group"><label class="form-label">联系电话</label><input type="text" class="form-input" value="021-xxxxxxxx"></div>
            <div class="form-group"><label class="form-label">官方网站</label><input type="text" class="form-input" value="www.xxdesign.com"></div>
          </div>
          <div class="form-group"><label class="form-label">公司 Logo（用于交付物水印）</label>
            <div style="width:120px;height:80px;background:var(--line-soft);border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
              <span class="text-xs text-muted">点击上传</span>
            </div>
          </div>
        </div>
        <div class="card" style="max-width:640px;">
          <div class="card-title" style="margin-bottom:16px;">通知偏好</div>
          <div class="flex flex-col gap-sm">
            <label class="flex items-center justify-between" style="padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;"><span class="text-sm">客户提交反馈时通知我</span><input type="checkbox" checked></label>
            <label class="flex items-center justify-between" style="padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;"><span class="text-sm">AI 渲染完成时通知我</span><input type="checkbox" checked></label>
            <label class="flex items-center justify-between" style="padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;"><span class="text-sm">客户确认冻结点时通知我</span><input type="checkbox" checked></label>
            <label class="flex items-center justify-between" style="padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;"><span class="text-sm">项目归档完成时通知我</span><input type="checkbox"></label>
            <label class="flex items-center justify-between" style="padding:10px 0;cursor:pointer;"><span class="text-sm">每周项目数据报告</span><input type="checkbox" checked></label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
</body>
</html>
