<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>效果图生成 · 工具箱</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
  .tool-header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 24px; display:flex; align-items:center; gap:16px; }
  .back-btn { display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; cursor:pointer; text-decoration:none; }
  .back-btn:hover { color:var(--accent); }
  .tool-title { font-size:18px; font-weight:700; }
  .render-layout { display:grid; grid-template-columns:340px 1fr; gap:24px; max-width:1200px; margin:0 auto; }
  .input-card { background:var(--card); border-radius:12px; padding:24px; height:fit-content; }
  .preview-card { background:var(--card); border-radius:12px; padding:24px; }
  .style-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .style-item { padding:10px; border:2px solid var(--line); border-radius:6px; cursor:pointer; text-align:center; font-size:12px; transition:all 0.2s; }
  .style-item:hover { border-color:var(--accent); }
  .style-item.selected { border-color:var(--accent); background:var(--accent-light); color:var(--accent); font-weight:600; }
  .render-canvas { width:100%; height:400px; border-radius:8px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .render-loading { position:absolute; inset:0; background:rgba(255,255,255,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; }
  .spinner { width:40px; height:40px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin-bottom:12px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .result-item { aspect-ratio:4/3; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:32px; cursor:pointer; transition:all 0.2s; border:2px solid transparent; }
  .result-item:hover { transform:scale(1.02); border-color:var(--accent); }
</style>
</head>
<body>
<div class="tool-header">
  <a href="knowledge.html" class="back-btn">← 返回工具箱</a>
  <div class="tool-title">🖼️ 效果图生成</div>
  <span class="tag tag-success">AI 渲染</span>
  <span style="flex:1;"></span>
  <button class="btn btn-secondary btn-sm">历史记录</button>
  <button class="btn btn-primary btn-sm">下载全部</button>
</div>
<main class="content">
  <div class="render-layout">
    <div class="input-card">
      <h3 style="font-size:15px;font-weight:600;margin-bottom:16px;">生成设置</h3>
      <div class="form-group"><label class="form-label">空间类型</label>
        <select class="form-select"><option>客厅</option><option>主卧</option><option>次卧</option><option>厨房</option><option>卫生间</option><option>书房</option><option>餐厅</option></select>
      </div>
      <div class="form-group"><label class="form-label">选择风格</label>
        <div class="style-grid">
          <div class="style-item selected">现代简约</div>
          <div class="style-item">北欧风</div>
          <div class="style-item">日式原木</div>
          <div class="style-item">新中式</div>
          <div class="style-item">轻奢风</div>
          <div class="style-item">工业风</div>
          <div class="style-item">法式复古</div>
          <div class="style-item">美式乡村</div>
        </div>
      </div>
      <div class="form-group"><label class="form-label">空间描述（可选）</label>
        <textarea class="form-textarea" placeholder="描述你想要的空间效果，如：大落地窗、浅色沙发、原木茶几..." style="height:80px;">大落地窗，浅色布艺沙发，原木色茶几，无主灯设计，暖色调灯光</textarea>
      </div>
      <div class="form-group"><label class="form-label">参考图（可选）</label>
        <div style="border:2px dashed var(--line);border-radius:8px;padding:20px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted);">
          <div style="font-size:24px;margin-bottom:4px;">📷</div>点击上传参考图
        </div>
      </div>
      <div class="grid grid-2 gap-md">
        <div class="form-group"><label class="form-label">出图数量</label>
          <select class="form-select"><option>4 张</option><option>2 张</option><option>6 张</option><option>8 张</option></select>
        </div>
        <div class="form-group"><label class="form-label">画面比例</label>
          <select class="form-select"><option>4:3</option><option>16:9</option><option>1:1</option><option>3:4</option></select>
        </div>
      </div>
      <button class="btn btn-primary w-full mt-md" onclick="document.getElementById('loading').style.display='flex';setTimeout(function(){document.getElementById('loading').style.display='none';},3000);">✨ 生成效果图</button>
      <div class="text-xs text-muted mt-sm text-center">本次生成将消耗 2 个渲染额度，剩余 48 个</div>
    </div>
    <div class="preview-card">
      <div class="flex items-center justify-between mb-md">
        <h3 style="font-size:15px;font-weight:600;">生成结果</h3>
        <span class="text-xs text-muted">客厅 · 现代简约 · 4:3</span>
      </div>
      <div class="render-canvas" style="background:linear-gradient(135deg,#F5EDE2,#E8D9C4);">
        <div id="loading" class="render-loading" style="display:none;">
          <div class="spinner"></div>
          <div class="text-sm font-semibold" style="color:var(--accent);">AI 正在渲染中...</div>
          <div class="text-xs text-muted mt-sm">预计还需 15 秒</div>
        </div>
        <div style="text-align:center;"><div style="font-size:48px;margin-bottom:8px;">🛋️</div><div class="text-sm text-muted">点击左侧「生成效果图」开始</div></div>
      </div>
      <div class="result-grid">
        <div class="result-item" style="background:linear-gradient(135deg,#F5EDE2,#E8D9C4);">🛋️</div>
        <div class="result-item" style="background:linear-gradient(135deg,#E8F0ED,#D4E5DD);">🌿</div>
        <div class="result-item" style="background:linear-gradient(135deg,#EBF1F8,#D4E2F0);">💡</div>
        <div class="result-item" style="background:linear-gradient(135deg,#FBF3E4,#F0E0C0);">🪑</div>
      </div>
      <div class="flex gap-sm justify-center mt-lg">
        <button class="btn btn-secondary btn-sm">不满意，重新生成</button>
        <button class="btn btn-secondary btn-sm">保存到材料库</button>
        <button class="btn btn-primary btn-sm">应用到项目</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
